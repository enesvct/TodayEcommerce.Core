# Local development infrastructure. Start: docker compose up -d   Stop: docker compose down
# Password comes from .env (git-ignored). Copy .env.example to .env first.
services:
  postgres:
    image: postgres:16-alpine
    container_name: todayecommerce-postgres
    environment:
      POSTGRES_DB: todayecommerce
      POSTGRES_USER: todayecommerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      # Named volume: data survives "docker compose down" (use "down -v" to wipe it).
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todayecommerce -d todayecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: todayecommerce-redis
    # Cache only: no persistence needed — losing it just means a few extra database reads.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # Bound to localhost only: this password-less instance must not be reachable from the network.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: todayecommerce-elasticsearch
    environment:
      discovery.type: single-node          # one node, no cluster: fine for development
      xpack.security.enabled: "false"      # local only (bound to 127.0.0.1); production MUST enable security
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"   # cap memory; the default would take a large share of RAM
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  elasticsearch-data:
  postgres-data:
